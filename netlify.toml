[build]
  publish = "."
  # Génère les pages dédiées /groupage-…-maroc/ à partir de index.html
  command = "node tools/pages/build.mjs"

# La redirection rtlmaroc.com <-> www est gérée par Netlify (domaine principal : Domain management).

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
